site_name: BDVM Wiki
site_description: Official documentation for Bunchy's Derail Valley Mods
site_url: https://bunchyearth23.github.io/bdvm-wiki/
repo_url: https://github.com/Bunchyearth23/bdvm-wiki
repo_name: Bunchyearth23/bdvm-wiki
edit_uri: edit/main/docs/
copyright: Copyright © 2026 Bunchy (Bunchyearth23) — Apache-2.0
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: bdvm-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
plugins:
  - search:
      lang: en
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
extra_css:
  - assets/stylesheets/extra.css
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Bunchyearth23
nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/overview.md
      - Installation: getting-started/installation.md
      - First session: getting-started/first-run.md
      - Updates and rollback: getting-started/updates.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Economy and companies: concepts/economy.md
      - Rolling stock: concepts/fleet.md
      - Contracts and industry: concepts/contracts.md
      - Multiplayer authority: concepts/multiplayer.md
  - Modules:
      - Overview: modules/index.md
      - Common: modules/common.md
      - Core: modules/core.md
      - Companies: modules/companies.md
      - Fleet: modules/fleet.md
      - Market: modules/market.md
      - Operations: modules/operations.md
      - Passengers: modules/passengers.md
      - Web: modules/web.md
      - Dispatch: modules/dispatch.md
      - Management: modules/management.md
      - Multiplayer Bridge: modules/multiplayer-bridge.md
      - SelfShunt Bridge: modules/selfshunt-bridge.md
      - PassengerJobs Bridge: modules/passengerjobs-bridge.md
      - Full: modules/full.md
  - Forks:
      - Overview: forks/index.md
      - Multiplayer: forks/multiplayer.md
      - SelfShunt: forks/selfshunt.md
      - PassengerJobs: forks/passengerjobs.md
      - Remote Dispatch Live: forks/remote-dispatch.md
  - Optional mods:
      - Compatibility catalog: mods/optional-mods.md
  - Operations:
      - Configuration: operations/configuration.md
      - In-game and Web UI: operations/interfaces.md
      - Diagnostics: operations/diagnostics.md
      - Compatibility: operations/compatibility.md
      - Test campaign: operations/testing.md
      - Troubleshooting: operations/troubleshooting.md
  - Development:
      - Build and repositories: development/build.md
      - Contracts and safety: development/contracts.md
      - Releases: development/releases.md
      - Contributing: development/contributing.md
  - Reference:
      - Decisions and limits: reference.md
      - FAQ: faq.md
